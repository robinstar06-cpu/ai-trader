name: AI Trader

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Proefrun (geen orders plaatsen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Kronos (voorspelmodel, MIT-licentie): code op een vaste versie, niet in deze repo opgeslagen
      - name: Kronos-code ophalen
        if: vars.KRONOS != 'off'
        uses: actions/checkout@v4
        with:
          repository: shiyu-coder/Kronos
          ref: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          path: .kronos
          persist-credentials: false

      - name: Kronos-model bewaren tussen runs
        if: vars.KRONOS != 'off'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-${{ vars.KRONOS_MODEL || 'NeoQuasar/Kronos-small' }}-v1

      # Mislukt dit, dan draait de bot gewoon zonder Kronos
      - name: Kronos-pakketten installeren
        if: vars.KRONOS != 'off'
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Bot draaien
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          MODELS: ${{ vars.MODELS }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          MAX_PER_COIN_PCT: ${{ vars.MAX_PER_COIN_PCT }}
          MIN_CASH_PCT: ${{ vars.MIN_CASH_PCT }}
          REBALANCE_BAND_PCT: ${{ vars.REBALANCE_BAND_PCT }}
          STOP_BUYING_DRAWDOWN_PCT: ${{ vars.STOP_BUYING_DRAWDOWN_PCT }}
          GOAL_PCT: ${{ vars.GOAL_PCT }}
          GOAL_DAYS: ${{ vars.GOAL_DAYS }}
          GOAL_STEP_PCT: ${{ vars.GOAL_STEP_PCT }}
          RISK_TOLERANCE_PCT: ${{ vars.RISK_TOLERANCE_PCT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY: ${{ vars.NOTIFY }}
          KRONOS: ${{ vars.KRONOS }}
          KRONOS_MODEL: ${{ vars.KRONOS_MODEL }}
          KRONOS_LOOKBACK: ${{ vars.KRONOS_LOOKBACK }}
          KRONOS_SAMPLES: ${{ vars.KRONOS_SAMPLES }}
        run: python bot.py

      - name: Melding bij fout
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: AI Trader: run mislukt" -H "Tags: warning" -H "Priority: 4" \
              -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "De run is mislukt. Tik om de details te bekijken." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi

      - name: Logboek opslaan
        if: always()
        run: |
          git config user.name "ai-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "Niets te bewaren."
            exit 0
          fi
          git commit -m "Run $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
